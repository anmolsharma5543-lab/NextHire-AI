<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextHire AI - Live Interview</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container interview-container">
        <!-- Top Status Bar -->
        <header class="interview-header">
            <div class="logo">⚡ Next<span>Hire</span> AI</div>
            <div class="badge" id="roleBadge">Loading...</div>
        </header>

        <!-- Question Card -->
        <main class="main-card interview-card">
            <div class="card-top-bar">
                <div class="progress-indicator">
                    Question <span id="currentQNum">1</span> of 5
                </div>
                <div class="timer-box" id="timerBox">⏳ 01:30</div>
            </div>

            <div class="question-box">
                <h2 id="questionText">Loading AI generated question based on your resume...</h2>
                <button id="speakQBtn" class="voice-btn" title="Listen Question">🔊 Listen AI</button>
            </div>

            <div class="answer-box">
                <div class="ans-label-bar">
                    <label for="userAnswer">Your Answer / Code Solution</label>
                    <button id="micBtn" class="voice-btn mic-btn">🎙️ Speak Answer</button>
                </div>
                <!-- Dual Mode Textarea / Code Editor Box -->
                <textarea id="userAnswer" rows="7"
                    placeholder="Type your answer or code here, or click 'Speak Answer'..."></textarea>
            </div>

            <button id="submitAnsBtn" class="glow-btn">Submit & Next Question ➔</button>
        </main>
    </div>

    <!-- PDF.js CDN Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
