<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextHire AI - Interview Report</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf Library for instant report downloading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <div class="container report-container">
        <!-- Header -->
        <header class="navbar">
            <div class="logo">⚡ Next<span>Hire</span> AI</div>
            <p class="tagline">Performance Summary & Ideal Answer Breakdown</p>
        </header>

        <!-- Printable Report Card -->
        <main class="main-card" id="reportPrintArea">
            <div class="score-display-box">
                <h2>Overall Interview Score</h2>
                <div class="score-circle">
                    <span id="finalScore">--</span><small>/100</small>
                </div>
            </div>

            <div class="feedback-section">
                <h3>Detailed AI Evaluation</h3>
                <div id="feedbackContainer" class="feedback-box">
                    <p>Analyzing responses...</p>
                </div>
            </div>

            <div class="qa-breakdown-section" style="margin-top: 20px;">
                <h3>Questions vs Your Answer vs AI Ideal Answer</h3>
                <div id="qaBreakdownContainer"
                    style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
                    <!-- Dynamically Populated QA breakdown -->
                </div>
            </div>
        </main>

        <div class="action-buttons" style="display: flex; gap: 10px; margin-top: 15px;">
            <button id="downloadPdfBtn" class="glow-btn" style="flex: 1;">📄 Download PDF Report</button>
            <button onclick="window.location.href='index.html'" class="glow-btn"
                style="flex: 1; background: #334155;">Start New Interview 🔄</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
