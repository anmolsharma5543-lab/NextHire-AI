<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextHire AI - AI-Powered Mock Interviewer</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">
        <!-- Header / Logo -->
        <header class="navbar">
            <div class="logo">⚡ Next<span>Hire</span> AI</div>
            <p class="tagline">Smart Mock Interviews & Resume Reviewer</p>
        </header>

        <!-- Main Card Section -->
        <main class="main-card">
            <div class="card-header">
                <h1>Ace Your Next Interview</h1>
                <p>Upload your resume, select target role, and let AI test your skills in real-time.</p>
            </div>

            <form id="setupForm" class="form-group">
                <div class="input-box">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Anmol Sharma" required>
                </div>

                <div class="input-box">
                    <label for="jobRole">Target Job Role</label>
                    <select id="jobRole" required>
                        <option value="" disabled selected>Select job role</option>
                        <option value="Java Full Stack Developer">Java Full Stack Developer</option>
                        <option value="Frontend Developer (React/Next.js)">Frontend Developer (React/Next.js)</option>
                        <option value="Node.js Backend Developer">Node.js Backend Developer</option>
                        <option value="Software Quality Assurance Tester">Software Quality Assurance Tester</option>
                    </select>
                </div>

                <div class="input-box">
                    <label for="difficulty">Interview Difficulty Level</label>
                    <select id="difficulty" required>
                        <option value="Easy">Easy (Fresher / Core Fundamentals)</option>
                        <option value="Medium" selected>Medium (Intermediate / Practical Scenarios)</option>
                        <option value="Hard">Hard (Senior Level / System Design & Edge Cases)</option>
                    </select>
                </div>

                <div class="input-box">
                    <label for="resumeFile">Upload Resume (PDF)</label>
                    <div class="file-drop-area">
                        <span class="file-msg">Drag & drop your PDF here or click to browse</span>
                        <input type="file" id="resumeFile" accept=".pdf" required>
                    </div>
                </div>

                <button type="submit" class="glow-btn">Start Mock Interview 🚀</button>
            </form>
        </main>

        <!-- Past History Container -->
        <div class="main-card history-section" style="margin-top: 15px;">
            <h3>📊 Past Interview Performance</h3>
            <div id="historyList" class="history-list">
                <p style="font-size: 13px; color: #64748b; margin-top: 5px;">No previous interviews found.</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>NextHire AI by Anmol Sharma</p>
        </footer>
    </div>

    <!-- PDF.js CDN Scripts & App Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
